<!-- Slate owns <head> and SEO metadata; this include only adds site-specific assets. -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicons/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicons/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicons/favicon-16x16.png' | relative_url }}">
<link rel="shortcut icon" href="{{ '/assets/favicons/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicons/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/assets/favicons/site.webmanifest' | relative_url }}">
<link rel="mask-icon" href="{{ '/assets/favicons/safari-pinned-tab.svg' | relative_url }}" color="#C94C0B">
<meta name="theme-color" content="#102238">
<link rel="stylesheet" href="{{ '/assets/css/brand.css' | relative_url }}">

    {% if site.enforce_https %}
        <script type="text/javascript">
            if (("{{ site.enforce_https }}" == window.location.host) && (window.location.protocol != "https:")) {
                window.location = window.location.toString().replace(/^http:/, "https:");
            }
        </script>
    {% endif %}

    {% if site.google and jekyll.environment == "production" %}
			<!-- Google tag (gtag.js) -->
			<script async src="https://www.googletagmanager.com/gtag/js?id=G-LEE139MXXS"></script>
			<script>
				window.dataLayer = window.dataLayer || [];
				function gtag(){dataLayer.push(arguments);}
				gtag('js', new Date());

				gtag('config', 'G-LEE139MXXS');
			</script>
    {% endif %}

    {% if site.google and jekyll.environment == "production" %}
        <!-- Google AdSense -->
				<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3568656413005000"
     crossorigin="anonymous"></script>
    {% endif %}
