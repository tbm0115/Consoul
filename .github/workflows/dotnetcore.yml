name: Build, Test, and Package

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Validate release packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # Existing tests/sample target net8.0 and need this runtime.
          dotnet-version: '8.0.x'
      - name: Read package version
        id: version
        run: |
          [xml]$properties = Get-Content -LiteralPath Directory.Build.props -Raw
          "version=$($properties.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT
      - name: Validate release identity
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: ./scripts/Validate-ReleaseTag.ps1 -Tag $env:RELEASE_TAG -Prerelease:($env:RELEASE_IS_PRERELEASE -eq 'true')
      - name: Restore, build, test, and verify all five packages
        run: ./scripts/Verify-Release.ps1
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
      - name: Save verified packages and symbols
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: artifacts/packages/${{ steps.version.outputs.version }}/*
          if-no-files-found: error

  publish:
    name: Publish approved release event
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts/publish
      - name: Recheck release identity and package contents
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          ./scripts/Validate-ReleaseTag.ps1 -Tag $env:RELEASE_TAG -Prerelease:($env:RELEASE_IS_PRERELEASE -eq 'true')
          ./scripts/Verify-Packages.ps1 -PackageDirectory artifacts/publish
      - name: Publish packages and symbols to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'NUGET_API_KEY is required for release publication.' }
          foreach ($package in Get-ChildItem -LiteralPath artifacts/publish -Filter '*.nupkg') {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
            if ($LASTEXITCODE -ne 0) { throw "NuGet package publication failed: $($package.Name)" }
          }
          foreach ($symbols in Get-ChildItem -LiteralPath artifacts/publish -Filter '*.snupkg') {
            dotnet nuget push $symbols.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet symbol publication failed: $($symbols.Name)" }
          }
      - name: Publish packages to GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
        run: |
          $source = "https://nuget.pkg.github.com/$env:PACKAGE_OWNER/index.json"
          $sourceConfig = Join-Path $env:RUNNER_TEMP 'consoul-github-packages.config'
          '<configuration><packageSources><clear /></packageSources></configuration>' | Set-Content -LiteralPath $sourceConfig
          dotnet nuget add source $source --name github --configfile $sourceConfig
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure the GitHub Packages source.' }
          foreach ($package in Get-ChildItem -LiteralPath artifacts/publish -Filter '*.nupkg') {
            dotnet nuget push $package.FullName --api-key $env:GITHUB_PACKAGES_TOKEN --source github --configfile $sourceConfig --skip-duplicate --no-symbols
            if ($LASTEXITCODE -ne 0) { throw "GitHub package publication failed: $($package.Name)" }
          }
